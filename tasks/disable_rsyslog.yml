---
- name: Get the list of services
  ansible.builtin.service_facts:
  when: ansible_facts['service_mgr'] == 'systemd'
  tags:
    - journald
    - validate

- name: Disable rsyslog socket
  ansible.builtin.systemd_service:
    name: rsyslog.socket
    state: stopped
    enabled: false
    masked: true
  when:
    - ansible_facts['service_mgr'] == 'systemd'
    - "'rsyslog.socket' in ansible_facts['services']"
  tags:
    - journald
    - service

- name: Disable rsyslog service
  ansible.builtin.systemd_service:
    name: rsyslog.service
    state: stopped
    enabled: false
    masked: true
  when:
    - ansible_facts['service_mgr'] == 'systemd'
    - "'rsyslog.service' in ansible_facts['services']"
  tags:
    - journald
    - service
