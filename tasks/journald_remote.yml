---
- name: Create journald-upload.conf.d directory if it does not exist
  ansible.builtin.file:
    path: "{{ journald_upload_confd_path }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags:
    - journald
    - config

- name: Refresh apt package cache for journald remote package
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_facts['os_family'] == 'Debian'
  tags:
    - journald
    - install

- name: Install systemd-journal-remote package
  ansible.builtin.package:
    name: "{{ journald_remote_pkg }}"
    state: present
  tags:
    - journald
    - install

- name: Refresh service facts after installing journal remote package
  ansible.builtin.service_facts:
  when: ansible_facts['service_mgr'] == 'systemd'
  tags:
    - journald
    - validate

- name: Enable systemd-journal-upload service
  ansible.builtin.systemd_service:
    name: "{{ journald_upload_service }}"
    enabled: true
    state: started
    masked: false
  when: ansible_facts['service_mgr'] == 'systemd'
  tags:
    - journald
    - service

- name: Write journald-upload configuration file
  ansible.builtin.template:
    src: journald-upload.conf.j2
    dest: "{{ journald_upload_confd_path }}/{{ journald_upload_conf_file }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart systemd-journald-upload service
  tags:
    - journald
    - config

- name: Stop active systemd-journal-remote receiver units
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: stopped
  loop:
    - "{{ journald_remote_socket }}"
    - "{{ journald_remote_service }}"
  when:
    - ansible_facts['service_mgr'] == 'systemd'
    - item in ansible_facts['services']
    - ansible_facts['services'][item].state == 'running'
  tags:
    - journald
    - service

- name: Disable enabled systemd-journal-remote receiver units
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: false
  loop:
    - "{{ journald_remote_socket }}"
    - "{{ journald_remote_service }}"
  when:
    - ansible_facts['service_mgr'] == 'systemd'
    - item in ansible_facts['services']
    - ansible_facts['services'][item].status == 'enabled'
  tags:
    - journald
    - service

- name: Mask unmasked systemd-journal-remote receiver units
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    masked: true
  loop:
    - "{{ journald_remote_socket }}"
    - "{{ journald_remote_service }}"
  when:
    - ansible_facts['service_mgr'] == 'systemd'
    - item in ansible_facts['services']
    - ansible_facts['services'][item].status != 'masked'
  tags:
    - journald
    - service
